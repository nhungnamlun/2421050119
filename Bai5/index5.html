<html>

<head>
    <title>Bài 5</title>

    <link rel="stylesheet" href="style.css" type="text/css">
    <!-- đè màu
        <style>
            h3 {
                color:red;

    <style>
        h2 {
            /* loại Internal style */
            /* color dùng để quy định màu chữ */
            color: red;
        }

        #tieude {
            color: orange;
        }
    </style>
</head>

<body>
    <!-- Kiểu 1 viết style trong thẻ -->
    <!-- Loại Inline style -->
    <h1 style="color blue">HUMG</h1>

    <!-- Kiểu 2 viết style ngoài thẻ -->
    <h2>Trường Đại học Mỏ - Địa chất</h2>

    <h3>Phát triển ứng dụng web</h3>

    <!-- II.Selector -->
    <!-- cách 1:dùng tên thẻ -->

    <!-- cách 2:dùng id -->
    <h2 id="tieude" class="tieude">Trường Đại học Mỏ - Địa chất</h2>
    <!-- cách 3 :dung class (viết dấy,trước tên class) -->

    <h3 class="tieude">Phát triển ứng dụng web</h3>
</body>

</html>
