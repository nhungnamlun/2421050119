<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript-1</title>
</head>

<body>

    <!-- Internal JavaScript -->
    <script>
        // in ra màn hình
        document.writeln("Hello World!  <br>");
        // khai bao bien
        var name = "Nhung  <br>";
        document.writeln(name);

        ten = "Nhi <br>";
        document.writeln(ten);

        var year = 2026;
        document.writeln(year);

        // phép toán

        var soThuNhat = 10;
        var soThuHai = 5;
        var ketQua = 0;
        // cong +
        document.write("<br> Ket qua soThu1 + soThu2 la:");
        ketQua = soThuNhat + soThuHai;
        document.write(ketQua);

        // tru -
        document.write("<br> Ket qua soThu1 - soThu2 la:");
        ketQua = soThuNhat - soThuHai;
        document.write(ketQua);

        // nhan *
        document.write("<br> Ket qua soThu1 * soThu2 la:");
        ketQua = soThuNhat * soThuHai;
        document.write(ketQua);

        // chia /
        document.write("<br> Ket qua soThu1 / soThu2 la:");
        ketQua = soThuNhat / soThuHai;
        document.write(ketQua);

        // %
        document.write("<br> Ket qua soThu1 % soThu2 la:");
        ketQua = soThuNhat % soThuHai;
        document.write(ketQua);

        // ++: phụ thuộc vài vị trí ta đặt dấu ++
        // nếu đặt sau biến nó sẽ in ra biến đó rồi mới in ra biến cộng đơn vị
        document.writeln("<br>");
        document.writeln(soThuNhat++);
        document.writeln("<br>");
        document.writeln(soThuNhat);

        // nếu đặt trước biến nó cộng thêm 1 đơn vị rồi mới in
        document.writeln("<br>");
        document.writeln(++soThuNhat);

        // -- giống ++
        document.writeln("<br>");
        document.writeln(soThuNhat--);
        document.writeln("<br>");
        document.writeln(soThuNhat);

        document.writeln("<br>");
        document.writeln(--soThuNhat);
        //+=
        soThuNhat += soThuHai;
        document.writeln(soThuNhat);

        //-=
        soThuNhat -= soThuHai;
        document.writeln(soThuNhat);

        var ho = "Tran";
        document.writeln("<br>" + ho + " " + ten);
        document.writeln("<br>");
        document.writeln(ho.length);

        // kiểm tra kiểu dữ liệu biến
        document.writeln(typeof (ho));

        // tìm vị trí của các kí tự
        var hoVaTen = "Nguyen Thi Nhung"
        // có kí tự trong chuỗi in ra stt của nó
        document.writeln(hoVaTen.indexOf("Nhung"));
        document.writeln("<br>");
        // không có kí tự trong chuỗi in ra -1
        document.writeln(hoVaTen.indexOf("m"));
        document.writeln("<br>");
        // cách tìm vị trí của các kí tự khác in ra true/false
        document.writeln(hoVaTen.includes("N"));
        document.writeln("<br>");

        document.writeln(hoVaTen.startsWith("Nguyen"));
        document.writeln("<br>");
        // thay thế kí tự
        document.write(hoVaTen.replace("Nguyen", "Tran"));

        // viết in hết cả chuỗi
        document.writeln("<br>");
        document.write(hoVaTen.toUpperCase());

        // viết thường
        document.writeln("<br>");
        // document.write(hoVaTen.toLocaleLowerCase());
        document.write(hoVaTen.toLowerCase());

        // hàm Date()
        var homNay = new Date();
        document.writeln("<br>");
        document.write(homNay);

        var ngay = new Date("09/30/2026");
        document.writeln("<br>");
        document.write(ngay);

        var namNay = homNay.getFullYear();
        document.writeln("<br>");
        document.write(namNay);

        var thangNay = homNay.getMonth();
        document.writeln("<br>");
        document.write(thangNay);

        var ngayHomNay = homNay.getDate();
        document.writeln("<br>");
        document.write(ngayHomNay);

        var ngayNay = homNay.getDay();
        document.writeln("<br>");
        document.write(ngayNay);

        document.writeln("<br> Hôm nay là thứ " + ++ngayNay + " ngày " + ngayHomNay + " tháng " + ++thangNay + " năm " + namNay);

        // Mảng
        var mangSo = [1, 2, 3, 4, 5];
        document.writeln("<br>");
        // document.write(mang);
        document.write(mangSo[2]);
        document.writeln("<br>");
        document.write(mangSo.length);

        var mangTen = ["nhung", "nhi", "dung"];
        document.writeln("<br>");
        document.write(mangTen[2]);

        var mang = [1, 2, 3, 4, 5, "nhung", "nhi", "dung"];
        document.writeln("<br>");
        document.write(mang[5]);

        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        document.write(d);
        // thêm dấu - vào giữa các phần tử
        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        document.writeln(d.join("-"));
        //  lấy phần tử cuối cùng trong mảng
        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        document.writeln(d.pop());

        // thêm phần tử
        var d = mang.concat(mangSo, mangTen);
        d.push("hằng");
        document.writeln(d);

        //  đảo ngược mang
        document.writeln("<br>");
        document.writeln(mangSo.reverse());

        // object
        var thongTinSinhVien = {
            ten: "Nguyen Thi Nhung",
            namSinh: 2006,
            queQuan: {
                xa: "Quynh An",
                tinh: "Hung Yen"
            }
        };
        document.writeln("<br>");
        document.writeln(thongTinSinhVien.ten);
        document.writeln("<br>");
        document.writeln(thongTinSinhVien.queQuan.tinh);

        tuoi = namNay - thongTinSinhVien.namSinh;
        thongTinSinhVien.tuoi;
        // console.log( thongTinSinhVien);
        document.writeln(tuoi);

        // boolean: true nam / false nu


        // == != < >
        //  === só sánh cả giá trị và kiểu dữ liệu
        var soThuNhat = 10;
        var soThuHai = 5;
        document.writeln("<br>");
        document.writeln(soThuNhat === soThuHai);

        // && 

        if (ngayNay > 6) {
            document.writeln("Cuối tuần");
        } else if (ngayNay == 6) {
            document.writeln("Sắp được ngủ");
        } else {
            document.writeln("Đi học");
        }

        document.writeln("<br>");
        var so = 5;
        if (so % 2 == 0) {
            document.writeln(so + "Đây là số chẵn");
        } else {
            document.writeln(so + "Đây là số lẻ");
        }
        // về xem vì sao var so = 200000000000000000000001; là số chẵn
    </script>
    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>

</html>
