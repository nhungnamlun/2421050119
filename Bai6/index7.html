<html>

<head>
    <title> Bài 6</title>
    <link rel="stylesheet" href="style1.css" type="text/css">
    <style>
        .khoi1 {
            background-color: blue;
        }

        .khoi2 {
            background-color: red;
            /* 1 giá trị: cách đều xung quanh = giá trị đó */
            /* 2 giá trị: giá trị đầu(trên dưới), giá trị 2(trái phải) */
            /* 4 giá trị: theo thứ tự trên phải dưới trái */
            /* margin: 50px 200px 10px 100px; */
            /* như margin điều chỉnh độ rộng của khung */
            /* padding: 50px; */
            /* Căn khối ra giữu */
            width:100px;
            margin:auto;
        }

        .khoi3 {
            background-color: yellow;
        }

        .khoi4 {
            background-color: aqua;
            /* cách để sử dụng linh hoạt phần còn trống(tắt display: block) */
            display: flex;
        }

        .khoi5 {
            background-color: chartreuse;
            width: 50%
        }

        .khoi6 {
            background-color: cornflowerblue;
            width: 50%
        }
    </style>
</head>

<body>
    <div class="khoi1">Khối 1</div>
    <div class="khoi2">Khối 2</div>
    <div class="khoi3">Khối 3</div>

    <div class="khoi4">
        <div class="khoi5">Khối 5</div>
        <div class="khoi6">Khối 6</div>
    </div>
</body>

</html>
